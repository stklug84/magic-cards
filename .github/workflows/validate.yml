---
# title: Validate knowledge graph workflow
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-07-25
# keywords: [infrastructure, rdf, validation]
# comment: |
#   Validates the MTG knowledge graph on pull requests against main:
#     - changes           : which paths the run touches; the OWL reasoning
#                           below runs only when the reasoned graph did
#     - rdf               : Turtle syntax (Jena riot) + SPARQL syntax
#                           (rdflib) + OWL consistency/coherence (ROBOT
#                           reason, HermiT) via the reusable stklug84/
#                           github-workflows rdf-validate workflow
#     - ttl-lint          : repo conventions and imports (validate_ttl.py)
#     - sparql-lint       : prefixes and term usage (validate_sparql.py)
#     - graph-consistency : cross-file graph checks (check_consistency.py)
#     - simulator-tests   : rules engine + viz unit tests, run against
#                           synthetic fixtures from this repository's own
#                           knowledge graph
#     - rust-tests        : the Rust workspace (rust/) test suites on
#                           Linux and macOS, against the same graph and
#                           Comprehensive Rules text
#
#   OWL reasoning (the rdf workflow's `owl` job) reasons two roots, each
#   over its full owl:imports closure resolved through catalog-v001.xml
#   (the graph imports by urn: IRIs, which ROBOT cannot dereference).
#   The catalog is untracked and regenerated in-job from the checked-out
#   ontologies via owl-prepare-command (scripts/generate_catalog.py):
#     - MagicCardsOntology.ttl      : TBox + set/keyword/subtype
#                                     individuals (~2 min with HermiT)
#     - MagicCardIndividuals.ttl    : + all per-set instance graphs under
#                                     sets/ (~8 min with HermiT)
#   `robot reason` certifies logical consistency and coherence (no
#   unsatisfiable classes). Note: `robot explain` cannot be used on this
#   graph as-is — xsd:date is outside the OWL 2 datatype map and HermiT's
#   explanation code path rejects it (reasoning itself is unaffected);
#   strip date literals first when debugging a future inconsistency.
# ---
name: Validate knowledge graph

on:
  push:
    branches: [main]
  pull_request:
    # rust-port/**: stacked pull requests of the Rust port get CI before
    # they are retargeted to main
    branches: [main, "rust-port/**"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a new push supersedes the in-flight validation of the
# same branch (the OWL reasoning job alone takes ~15 minutes). Runs on
# main are never cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which paths the run touches. HermiT over the full per-set closure
  # takes ~15 minutes and its verdict can only change when a Turtle
  # file, the catalog generator or this workflow changes, so the rdf
  # job reasons only then (its turtle and sparql jobs always run; they
  # take a minute). The owl job that `run-owl` switches off still
  # reports its check - as skipped, which the ruleset counts as passing
  # - whereas a workflow-level path filter would leave the required
  # check pending forever. A pull request compares the base tip with
  # the merge commit (what merging would change on main), a push the
  # previous tip with the new one; a manual run always reasons.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      owl: ${{ steps.diff.outputs.owl }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Does the change touch the reasoned graph?
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          owl=true
          case "$EVENT_NAME" in
            pull_request|push)
              if [ -n "$BASE_SHA" ] \
                 && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
                 && git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
                changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- \
                  '*.ttl' scripts/generate_catalog.py .github/workflows/validate.yml)
                if [ -z "$changed" ]; then
                  owl=false
                  echo "No Turtle file, catalog generator or workflow change" \
                    "between ${BASE_SHA:0:12} and ${GITHUB_SHA:0:12}: OWL reasoning is skipped."
                else
                  printf 'Reasoned-graph changes between %s and %s:\n%s\n' \
                    "${BASE_SHA:0:12}" "${GITHUB_SHA:0:12}" "$changed"
                fi
              else
                echo "No usable base commit for this $EVENT_NAME event: OWL reasoning runs."
              fi
              ;;
            *)
              echo "$EVENT_NAME event: OWL reasoning runs."
              ;;
          esac
          echo "owl=$owl" >> "$GITHUB_OUTPUT"

  # Turtle syntax (riot --validate) + SPARQL grammar (rdflib) for every
  # *.ttl in the repo (root ontologies, sets/) and every query
  # under queries/, plus OWL reasoning over the ontology and the full
  # per-set instance-graph closure (see the header comment) when the
  # changes job found the reasoned graph touched.
  rdf:
    needs: changes
    # A reusable-workflow path plus a 40-character SHA cannot fit in 120
    # columns; the trailing version comment stays because that is the form
    # Dependabot reads and rewrites.
    # yamllint disable-line rule:line-length
    uses: stklug84/github-workflows/.github/workflows/rdf-validate.yml@e099d4771b62e7814a0206424b176b91a1747ecc  # v4.1.0
    with:
      turtle-glob: "**/*.ttl"
      sparql-glob: "queries/**/*.rq"
      owl-files: "MagicCardsOntology.ttl MagicCardIndividuals.ttl"
      owl-catalog: "catalog-v001.xml"
      owl-prepare-command: "python3 scripts/generate_catalog.py"
      run-owl: ${{ needs.changes.outputs.owl == 'true' }}

  ttl-lint:
    name: TTL conventions and imports (rdflib)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install "rdflib>=7,<8"

      - name: Validate TTL files
        run: |
          set -euo pipefail
          python3 scripts/validate_ttl.py

  sparql-lint:
    name: SPARQL syntax, prefixes, and terms
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install "rdflib>=7,<8"

      - name: Validate SPARQL queries
        run: |
          set -euo pipefail
          python3 scripts/validate_sparql.py

  graph-consistency:
    name: Cross-file graph consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install "rdflib>=7,<8"

      - name: Run consistency checks
        run: |
          set -euo pipefail
          python3 scripts/check_consistency.py

  simulator-tests:
    name: Rules engine + viz unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      # The Comprehensive Rules text is gitignored (not distributed with
      # the repo, see README); the rules engine validates its @rule
      # annotations against it at import time, so CI fetches the pinned
      # release from Wizards of the Coast.
      # Gitignored and never distributed: fetched at run time, cached by
      # edition (an edition is immutable, so a cache hit is always valid).
      - name: Download Comprehensive Rules
        uses: stklug84/actions/mtg/fetch-comprehensive-rules@c6c3adbc4140cbf096c0c61c30b4fa96ff82b8dd  # v2.19.0
        with:
          cr-date: "20260925"

      - name: Card data-layer tests (deck formats / Scryfall mapping)
        working-directory: scripts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s mtgcards/tests -t .

      - name: Rules-engine conformance tests (stdlib only)
        working-directory: scripts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s mtgrules/tests -t .

      - name: Visualization tests (recorder / replay)
        working-directory: scripts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s mtgviz/tests -t .

  # The Rust workspace: unit, integration and property tests on the hosts
  # of the release targets (Windows joins once the binaries exist). The
  # Comprehensive Rules text is fetched exactly like for simulator-tests:
  # the engine validates its #[rule] annotations against it. Tests that
  # need the text skip with a notice when it is absent locally;
  # MTG_REQUIRE_CR=1 turns that skip into a failure here. The compiler is
  # pinned by rust/rust-toolchain.toml and installed by the runner's
  # rustup.
  rust-tests:
    name: Rust workspace tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      MTG_REQUIRE_CR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download Comprehensive Rules
        uses: stklug84/actions/mtg/fetch-comprehensive-rules@c6c3adbc4140cbf096c0c61c30b4fa96ff82b8dd  # v2.19.0
        with:
          cr-date: "20260925"

      - name: Install the pinned toolchain
        working-directory: rust
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show active-toolchain

      # actions/cache rather than a third-party Rust cache action: the
      # repository's actions policy allows GitHub-owned actions only.
      - name: Cache cargo registry and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-

      - name: Test
        working-directory: rust
        run: cargo test --workspace --all-features
