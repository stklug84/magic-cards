---
# title: Validate knowledge graph workflow
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-07-25
# keywords: [infrastructure, rdf, validation]
# comment: |
#   Validates the MTG knowledge graph on pull requests against main:
#     - rdf               : Turtle syntax (Jena riot) + SPARQL syntax
#                           (rdflib) via the reusable stklug84/
#                           github-workflows rdf-validate workflow
#     - ttl-lint          : repo conventions and imports (validate_ttl.py)
#     - sparql-lint       : prefixes and term usage (validate_sparql.py)
#     - graph-consistency : cross-file graph checks (check_consistency.py)
#     - simulator-tests   : rules engine + viz unit tests and a 3-game
#                           smoke matchup
#
#   OWL reasoning (the rdf workflow's `owl` job) is disabled: `owl-files`
#   is empty, so the job auto-skips. Local ROBOT 1.9.8 / HermiT results
#   (2026-07-25):
#     - MagicCardsOntology.ttl: logically INCONSISTENT — tracked in
#       docs/python-strictness-roadmap.md (follow-up section), not fixed
#       here.
#     - All other root TTLs (MagicCardCollection, MagicCardSynergies,
#       MagicCardIndividuals, MagicExternalCards,
#       MagicSimulationAnnotations): owl:imports the ontology by a urn:
#       IRI that ROBOT cannot resolve without a catalog — reasoning them
#       standalone fails at load time.
# ---
name: Validate knowledge graph

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Turtle syntax (riot --validate) + SPARQL grammar (rdflib) for every
  # *.ttl in the repo (root ontologies, decks/, sets/) and every query
  # under queries/. See the header comment for why owl-files is empty.
  rdf:
    uses: stklug84/github-workflows/.github/workflows/rdf-validate.yml@v1.18.0
    with:
      turtle-glob: "**/*.ttl"
      sparql-glob: "queries/**/*.rq"

  ttl-lint:
    name: TTL conventions and imports (rdflib)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install "rdflib>=7,<8"

      - name: Validate TTL files
        run: |
          set -euo pipefail
          python3 scripts/validate_ttl.py

  sparql-lint:
    name: SPARQL syntax, prefixes, and terms
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install "rdflib>=7,<8"

      - name: Validate SPARQL queries
        run: |
          set -euo pipefail
          python3 scripts/validate_sparql.py

  graph-consistency:
    name: Cross-file graph consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install "rdflib>=7,<8"

      - name: Run consistency checks
        run: |
          set -euo pipefail
          python3 scripts/check_consistency.py

  simulator-tests:
    name: Rules engine + viz unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The Comprehensive Rules text is gitignored (not distributed with
      # the repo, see README); the rules engine validates its @rule
      # annotations against it at import time, so CI fetches the pinned
      # release from Wizards of the Coast.
      - name: Download Comprehensive Rules (gitignored, not distributed)
        env:
          CR_DATE: "20260619"
        run: |
          set -euo pipefail
          curl -fsSL -o "MagicCompRules-${CR_DATE}.txt" \
            "https://media.wizards.com/2026/downloads/MagicCompRules%20${CR_DATE}.txt"

      - name: Rules-engine conformance tests (stdlib only)
        working-directory: scripts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s mtgrules/tests -t .

      - name: Visualization tests (recorder / replay)
        working-directory: scripts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s mtgviz/tests -t .

      - name: "Smoke: 3-game matchup with stats report"
        run: |
          set -euo pipefail
          python3 scripts/simulate_matchup.py \
            strategies/station-swarm-counter-deck.txt \
            strategies/blight-curse-deck.txt \
            --games 3 --seed 7 | tee /tmp/report.txt
          grep -q "wins" /tmp/report.txt
