---
# title: Validate knowledge graph workflow
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-07-25
# keywords: [infrastructure, rdf, validation]
# comment: |
#   Validates the MTG knowledge graph on pull requests against main:
#     - changes           : which paths the run touches; the OWL reasoning
#                           below runs only when the reasoned graph did
#     - rdf               : Turtle syntax (Jena riot) + SPARQL syntax
#                           (rdflib) + OWL consistency/coherence (ROBOT
#                           reason, HermiT) via the reusable stklug84/
#                           github-workflows rdf-validate workflow
#     - ttl-lint          : repo conventions and imports (validate_ttl.py)
#     - sparql-lint       : prefixes and term usage (validate_sparql.py)
#     - graph-consistency : cross-file graph checks (check_consistency.py)
#     - tooling-tests     : the Python graph tooling (the generator's
#                           helpers, the graph-bundle builder)
#     - rust-tests        : the simulator, i.e. the Rust workspace (rust/)
#                           test suites on Linux and macOS, against this
#                           repository's own knowledge graph and the
#                           Comprehensive Rules text
#     - rust-coverage     : the workspace's line coverage, gated at 90 %
#     - linux-release     : the Linux release binaries, built as
#                           release.yml builds them (manylinux_2_28,
#                           glibc 2.28) when the change touches rust/,
#                           release.yml or this workflow
#     - linux-release-gate: the required check "Linux release build":
#                           passes when both builds passed or there was
#                           nothing to build
#
#   OWL reasoning (the rdf workflow's `owl` job) reasons two roots, each
#   over its full owl:imports closure resolved through catalog-v001.xml
#   (the graph imports by urn: IRIs, which ROBOT cannot dereference).
#   The catalog is untracked and regenerated in-job from the checked-out
#   ontologies via owl-prepare-command (scripts/generate_catalog.py):
#     - MagicCardsOntology.ttl      : TBox + set/keyword/subtype
#                                     individuals (2-3 min with HermiT)
#     - MagicCardIndividuals.ttl    : + all per-set instance graphs under
#                                     sets/ (8-25 min with HermiT)
#   GitHub's runners differ in speed: the same graph took 10 to 28
#   minutes, about 16 typically (26 runs on 2026-11-05 and -06).
#   `robot reason` certifies logical consistency and coherence (no
#   unsatisfiable classes). Note: `robot explain` cannot be used on this
#   graph as-is — xsd:date is outside the OWL 2 datatype map and HermiT's
#   explanation code path rejects it (reasoning itself is unaffected);
#   strip date literals first when debugging a future inconsistency.
# ---
name: Validate knowledge graph

on:
  push:
    branches: [main]
  pull_request:
    # rust-port/**: stacked pull requests of the Rust port get CI before
    # they are retargeted to main
    branches: [main, "rust-port/**"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a new push supersedes the in-flight validation of the
# same branch (the OWL reasoning job alone takes 10 to 28 minutes). Runs
# on main are never cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which paths the run touches. OWL reasoning (HermiT, both roots)
  # takes 10 to 28 minutes and its verdict can only change when a Turtle
  # file, the catalog generator or this workflow changes, so the rdf
  # job reasons only then (its turtle and sparql jobs always run; they
  # take a minute). The owl job that `run-owl` switches off still
  # reports its check - as skipped, which the ruleset counts as passing
  # - whereas a workflow-level path filter would leave the required
  # check pending forever. A pull request compares the base tip with
  # the merge commit (what merging would change on main), a push the
  # previous tip with the new one; a manual run always reasons. The
  # Linux release build is gated the same way, on rust/, release.yml and
  # this workflow.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      owl: ${{ steps.diff.outputs.owl }}
      linux-release: ${{ steps.diff.outputs.linux_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Does the change touch the reasoned graph or the release build?
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          owl=true
          linux_release=true
          case "$EVENT_NAME" in
            pull_request|push)
              if [ -n "$BASE_SHA" ] \
                 && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
                 && git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
                changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- \
                  '*.ttl' scripts/generate_catalog.py .github/workflows/validate.yml)
                if [ -z "$changed" ]; then
                  owl=false
                  echo "No Turtle file, catalog generator or workflow change" \
                    "between ${BASE_SHA:0:12} and ${GITHUB_SHA:0:12}: OWL reasoning is skipped."
                else
                  printf 'Reasoned-graph changes between %s and %s:\n%s\n' \
                    "${BASE_SHA:0:12}" "${GITHUB_SHA:0:12}" "$changed"
                fi
                built=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- \
                  rust .github/workflows/release.yml .github/workflows/validate.yml)
                if [ -z "$built" ]; then
                  linux_release=false
                  echo "No change to rust/, release.yml or this workflow: the Linux release build is skipped."
                fi
              else
                echo "No usable base commit for this $EVENT_NAME event: OWL reasoning runs."
              fi
              ;;
            *)
              echo "$EVENT_NAME event: OWL reasoning runs."
              ;;
          esac
          echo "owl=$owl" >> "$GITHUB_OUTPUT"
          echo "linux_release=$linux_release" >> "$GITHUB_OUTPUT"

  # Turtle syntax (riot --validate) + SPARQL grammar (rdflib) for every
  # *.ttl in the repo (root ontologies, sets/) and every query
  # under queries/, plus OWL reasoning over the ontology and the full
  # per-set instance-graph closure (see the header comment) when the
  # changes job found the reasoned graph touched.
  rdf:
    needs: changes
    # A reusable-workflow path plus a 40-character SHA cannot fit in 120
    # columns; the trailing version comment stays because that is the form
    # Dependabot reads and rewrites.
    # yamllint disable-line rule:line-length
    uses: stklug84/github-workflows/.github/workflows/rdf-validate.yml@b5573d6dbca2f556219f3e4f04f664b82ad1a007  # v4.2.0
    with:
      turtle-glob: "**/*.ttl"
      sparql-glob: "queries/**/*.rq"
      owl-files: "MagicCardsOntology.ttl MagicCardIndividuals.ttl"
      owl-catalog: "catalog-v001.xml"
      owl-prepare-command: "python3 scripts/generate_catalog.py"
      run-owl: ${{ needs.changes.outputs.owl == 'true' }}

  ttl-lint:
    name: TTL conventions and imports (rdflib)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install "rdflib>=7,<8"

      - name: Validate TTL files
        run: |
          set -euo pipefail
          python3 scripts/validate_ttl.py

  sparql-lint:
    name: SPARQL syntax, prefixes, and terms
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install "rdflib>=7,<8"

      - name: Validate SPARQL queries
        run: |
          set -euo pipefail
          python3 scripts/validate_sparql.py

  graph-consistency:
    name: Cross-file graph consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install "rdflib>=7,<8"

      - name: Run consistency checks
        run: |
          set -euo pipefail
          python3 scripts/check_consistency.py

  # The Python graph tooling: the generator's pure helpers, the
  # graph-bundle builder and the MTG Arena collection tool (stdlib
  # unittest, no rdflib and no Playwright needed: the arena tests are
  # offline, on synthetic card data).
  tooling-tests:
    name: Graph tooling tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Generator and bundle-builder tests
        working-directory: scripts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s mtgcards/tests -t .

      - name: MTG Arena collection tool tests (offline)
        working-directory: scripts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s mtgarena/tests -t .

  # The simulator (the Rust workspace): unit, integration, property and
  # snapshot tests on the hosts of the release targets. The Comprehensive
  # Rules text is gitignored (not distributed with the repo, see README);
  # the engine validates its #[rule] annotations against it, so CI fetches
  # the pinned edition from Wizards of the Coast, cached by edition (an
  # edition is immutable, so a cache hit is always valid). Tests that need
  # the text skip with a notice when it is absent locally; MTG_REQUIRE_CR=1
  # turns that skip into a failure here. The compiler is pinned by
  # rust/rust-toolchain.toml and installed by the runner's rustup.
  rust-tests:
    name: Rust workspace tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      MTG_REQUIRE_CR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download Comprehensive Rules
        uses: stklug84/actions/mtg/fetch-comprehensive-rules@561b92c180aed0f6ce7d311d66dec7d22aa37721  # v2.19.1
        with:
          cr-date: "20261106"

      - name: Install the pinned toolchain
        working-directory: rust
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show active-toolchain

      # actions/cache rather than a third-party Rust cache action: the
      # repository's actions policy allows GitHub-owned actions only.
      - name: Cache cargo registry and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-

      - name: Test
        working-directory: rust
        run: cargo test --workspace --all-features

  # Line coverage of the Rust workspace. The gate is a floor: new code
  # arrives with its tests. cargo-llvm-cov is a pinned release asset,
  # checksummed like cargo-deny in lint.yml (the project publishes no
  # .sha256 files; the hash is the asset's at pinning time).
  rust-coverage:
    name: Rust line coverage (>= 90 %)
    runs-on: ubuntu-latest
    env:
      MTG_REQUIRE_CR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download Comprehensive Rules
        uses: stklug84/actions/mtg/fetch-comprehensive-rules@561b92c180aed0f6ce7d311d66dec7d22aa37721  # v2.19.1
        with:
          cr-date: "20261106"

      - name: Install the pinned toolchain and the LLVM tools
        working-directory: rust
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup component add llvm-tools-preview
          rustup show active-toolchain

      - name: Cache cargo registry and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: cargo-cov-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            cargo-cov-${{ runner.os }}-

      - name: Install cargo-llvm-cov
        env:
          LLVM_COV_VERSION: "0.9.1"
          LLVM_COV_SHA256: "b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a"
        run: |
          set -euo pipefail
          curl -fsSL -o cargo-llvm-cov.tar.gz \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LLVM_COV_SHA256}  cargo-llvm-cov.tar.gz" | sha256sum -c -
          tar xzf cargo-llvm-cov.tar.gz -C "$HOME/.cargo/bin" cargo-llvm-cov
          cargo llvm-cov --version

      - name: Coverage
        working-directory: rust
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --all-features --summary-only --fail-under-lines 90

  # The Linux release binaries, built by the script release.yml runs:
  # inside PyPA's manylinux_2_28 image (glibc 2.28, pinned by digest in
  # rust/release/), failing when a binary needs a newer glibc. A change
  # that would break the release build, or raise the glibc the binaries
  # need (a dependency calling a newer libc function), fails its pull
  # request instead of the release. Skipped when the changes job finds no
  # change to rust/, release.yml or this workflow; linux-release-gate
  # below reports the outcome as the required check.
  linux-release:
    name: Linux release build (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.linux-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Build in the manylinux_2_28 image and check the glibc floor
        env:
          TARGET: ${{ matrix.target }}
        run: rust/release/build-linux.sh "$TARGET"

      - name: Run the binaries on the runner
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for name in mtg-simulate mtg-selfplay mtg-cr; do
            "rust/target/${TARGET}/release/${name}" --version
          done

  # The required check of the Linux release build. A required check has to
  # report under one fixed name on every pull request, and the two matrix
  # jobs above neither run on most of them nor have a fixed name. This job
  # always runs: it passes when both builds passed, or when the changes job
  # found nothing to build, and fails otherwise (a failed or cancelled
  # build, or a changes job that did not succeed).
  linux-release-gate:
    name: Linux release build
    needs: [changes, linux-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The Linux release build passed, or there was nothing to build
        env:
          CHANGES: ${{ needs.changes.result }}
          WANTED: ${{ needs.changes.outputs.linux-release }}
          BUILD: ${{ needs.linux-release.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != "success" ]; then
            echo "::error::the changes job ended with '$CHANGES'"
            exit 1
          fi
          if [ "$WANTED" != "true" ]; then
            echo "No change to rust/, release.yml or validate.yml: nothing to build."
            exit 0
          fi
          if [ "$BUILD" != "success" ]; then
            echo "::error::the Linux release build ended with '$BUILD'"
            exit 1
          fi
          echo "Both Linux release builds passed."
