---
# title: Regenerate knowledge graph workflow
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-07-25
# keywords: [infrastructure, rdf, generation]
# comment: |
#   Regenerates the generated portions of the knowledge graph whenever
#   the source inventory changes (push to collection.csv on main) or on
#   manual dispatch, via the reusable stklug84/github-workflows
#   rdf-generate workflow:
#     - prepare  : scripts/build_vocab.py extracts the controlled
#                  vocabulary and master-file card list from
#                  MagicCardsOntology.ttl / MagicExternalCards.ttl
#     - fetch    : scripts/generate_individuals.py fetch resolves every
#                  printing via the Scryfall API (response cache keyed
#                  on collection.csv)
#     - generate : emits sets/*.ttl
#     - collection : emits MagicCardCollection.ttl
#     - finalize : scripts/update_imports.py rewrites the owl:imports
#                  block of MagicCardIndividuals.ttl
#
#   Changed files are pushed to the chore/regenerate-graph branch and
#   opened as a pull request, which the Validate knowledge graph
#   workflow gates. The PR is created with the workflow token, so
#   validation does not start automatically — close/reopen the PR (or
#   configure a PAT secret) to trigger it.
# ---
name: Regenerate knowledge graph

on:
  push:
    branches: [main]
    paths: [collection.csv]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rdf-generate
  cancel-in-progress: false

jobs:
  generate:
    uses: stklug84/github-workflows/.github/workflows/rdf-generate.yml@v1.20.0
    permissions:
      contents: write
      pull-requests: write
    with:
      prepare-command: "python3 scripts/build_vocab.py"
      finalize-command: "python3 scripts/update_imports.py"
