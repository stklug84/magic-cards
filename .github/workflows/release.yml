---
# title: Release workflow
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-08-11
# keywords: [infrastructure, packaging, release]
# comment: |
#   Builds the magic-cards-tools Python artifact (wheel + sdist: the
#   graph-bundle contract and the graph validators) on version tags (v*)
#   and creates a *draft* GitHub Release for it. The tag must match the
#   version in pyproject.toml and in rust/Cargo.toml (vX.Y.Z <-> X.Y.Z);
#   the built wheel is smoke-tested (install, import, mtg-validate
#   --help) before the draft is created.
#
#   The simulator binaries (mtg-simulate, mtg-selfplay, mtg-cr) are then
#   built from the Rust workspace in release mode on every supported
#   platform, smoke-tested (--version against the tag, the #[rule]
#   registry against the Comprehensive Rules, a short offline matchup
#   over the checked-out graph) and attached to the draft as tarballs
#   with SHA-256 checksums: one archive per target triple. The last job
#   publishes the draft once every binary is attached.
#
#   The draft is load-bearing: the repository's releases are immutable,
#   so a published release accepts no further assets (uploading to one
#   fails with HTTP 422) - the wheel and the binaries have to be complete
#   before the release goes public. A failed binary build therefore
#   leaves a draft only the maintainers see, never a half release.
#
#   The build -> verify -> create sequence is the reusable stklug84/
#   github-workflows release-artifact workflow, the same one release-
#   graph.yml uses for the knowledge graph bundle. Only the commands
#   below are repository-specific; each runs with RELEASE_TAG and
#   RELEASE_VERSION exported.
#
#   tag-prefix is deliberately empty so RELEASE_VERSION is the full tag
#   (v0.1.0, not 0.1.0): it is what the release title carries, and the
#   pyproject comparison strips the leading v itself.
# ---
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # A reusable-workflow path plus a 40-character SHA cannot fit in 120
    # columns; the trailing version comment stays because that is the form
    # Dependabot reads and rewrites.
    # yamllint disable-line rule:line-length
    uses: stklug84/github-workflows/.github/workflows/release-artifact.yml@e099d4771b62e7814a0206424b176b91a1747ecc  # v4.1.0
    permissions:
      contents: write
    with:
      tag-prefix: ""
      version-pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'

      install-command: "pip install build"

      # The tag must agree with the packaged version and with the Rust
      # workspace version the binaries report.
      prepare-command: |
        script='import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
        pyver="$(python3 -c "$script")"
        if [ "$pyver" != "${RELEASE_VERSION#v}" ]; then
          echo "::error::tag ${RELEASE_TAG} does not match pyproject version ${pyver}"
          exit 1
        fi
        script='import tomllib; print(tomllib.load(open("rust/Cargo.toml", "rb"))["workspace"]["package"]["version"])'
        rsver="$(python3 -c "$script")"
        if [ "$rsver" != "${RELEASE_VERSION#v}" ]; then
          echo "::error::tag ${RELEASE_TAG} does not match the Rust workspace version ${rsver}"
          exit 1
        fi

      build-command: "python3 -m build"

      # A wheel is not an archive the workflow should unpack; the smoke
      # tests install it into throwaway virtualenvs instead. The default
      # install is stdlib-only (mtgcards: the manifest contract and the
      # behavior-key whitelist).
      smoke-command: |
        python3 -m venv /tmp/smoke
        /tmp/smoke/bin/pip install dist/*.whl
        /tmp/smoke/bin/python -c "import mtgcards.graph, mtgcards.behaviors"

      # mtgvalidate ships in the same wheel but needs rdflib, so it is
      # only importable once the validate extra is requested.
      validate-command: |
        python3 -m venv /tmp/smoke-validate
        /tmp/smoke-validate/bin/pip install "$(echo dist/*.whl)[validate]"
        /tmp/smoke-validate/bin/mtg-validate --help > /dev/null

      release-assets: "dist/*"
      release-name: "magic-cards-tools"
      # published by the `publish` job below, after the binaries
      draft: true

  # The simulator binaries, one tarball per target. Runs after the
  # Python artifact's job so the draft the assets attach to exists; the
  # matrix mirrors the platforms validate.yml tests (Linux and macOS,
  # both architectures).
  binaries:
    name: Rust binaries (${{ matrix.target }})
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      MTG_REQUIRE_CR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download Comprehensive Rules
        uses: stklug84/actions/mtg/fetch-comprehensive-rules@c6c3adbc4140cbf096c0c61c30b4fa96ff82b8dd  # v2.19.0
        with:
          cr-date: "20260925"

      - name: Install the pinned toolchain
        working-directory: rust
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache cargo registry and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: cargo-release-${{ matrix.target }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            cargo-release-${{ matrix.target }}-

      - name: Build the binaries
        working-directory: rust
        run: cargo build --release --locked -p mtgsim

      # The binaries report the workspace version, which the release job
      # has already checked against the tag; the registry check loads
      # the fetched rules text; the matchup runs over the checked-out
      # graph with two small decklists.
      - name: Smoke-test the binaries
        working-directory: rust
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export MTG_GRAPH_ROOT="$GITHUB_WORKSPACE"
          bin=target/release
          for name in mtg-simulate mtg-selfplay mtg-cr; do
            version="$("$bin/$name" --version | awk '{print $NF}')"
            if [ "v$version" != "$RELEASE_TAG" ]; then
              echo "::error::$name --version reports $version, the tag is $RELEASE_TAG"
              exit 1
            fi
          done
          "$bin/mtg-cr" check
          printf '// Commander\n1 Pia Nalaar, Chief Mechanic\n1 Sol Ring\n30 Swamp\n' > /tmp/a.txt
          printf '// Commander\n1 Pia Nalaar, Chief Mechanic\n1 Arcane Signet\n30 Mountain\n' > /tmp/b.txt
          "$bin/mtg-simulate" /tmp/a.txt /tmp/b.txt --offline --games 1 --turn-cap 3 > /dev/null
          "$bin/mtg-selfplay" /tmp/a.txt --games 1 --turn-cap 2 > /dev/null

      - name: Package the archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="mtg-simulate-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp rust/target/release/mtg-simulate rust/target/release/mtg-selfplay rust/target/release/mtg-cr "dist/$name/"
          cp LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          if command -v sha256sum > /dev/null; then
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi
          cat "dist/$name.tar.gz.sha256"

      # gh resolves a draft by its tag name (the tags endpoint does not
      # list drafts; gh falls back to the release list).
      - name: Attach the archive to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber

  # Publish once the wheel and all four binary archives are attached.
  # Publishing makes the release immutable (see the header comment), so
  # the asset list is checked first: a missing archive keeps the draft.
  publish:
    name: Publish the release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the assets and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          echo "$assets"
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            for suffix in .tar.gz .tar.gz.sha256; do
              name="mtg-simulate-${RELEASE_TAG}-${target}${suffix}"
              if ! grep -qxF "$name" <<<"$assets"; then
                echo "::error::$name is not attached to the draft; the release stays a draft"
                exit 1
              fi
            done
          done
          if ! grep -qE '^magic_cards_tools-.*\.whl$' <<<"$assets"; then
            echo "::error::the wheel is not attached to the draft; the release stays a draft"
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json isDraft,url --jq '"published: \(.url) (draft=\(.isDraft))"'
