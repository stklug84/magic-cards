---
# title: Lint workflow
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-07-25
# keywords: [infrastructure, linting]
# comment: |
#   Lints the repository on pull requests against main:
#     - actionlint   : .github/workflows/* (incl. shellcheck on run: steps)
#     - yamllint     : all YAML files (.yamllint.yml)
#     - markdownlint : all Markdown files (.markdownlint.yml)
#     - python       : ruff (select = ALL) + mypy --strict + bandit on
#                      scripts/ via the reusable stklug84/github-workflows
#                      python-validate workflow (tool config in
#                      pyproject.toml)
#     - package-build: the magic-cards-tools wheel + sdist build and the
#                      wheel installs/imports (released via release.yml)
# ---
name: Lint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a new push supersedes the in-flight lint of the same
# pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download actionlint
        id: get-actionlint
        env:
          ACTIONLINT_VERSION: 1.7.10
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/rhysd/actionlint"
          bash <(curl -fsSL "$BASE/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") \
            "$ACTIONLINT_VERSION"

      - name: Run actionlint
        run: |
          set -euo pipefail
          ./actionlint -color

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install yamllint
        run: |
          set -euo pipefail
          pip install --user yamllint

      - name: Run yamllint
        run: |
          set -euo pipefail
          yamllint --strict .

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          config: .markdownlint.yml
          globs: '**/*.md'

  # Ruff (lint + format check), mypy --strict and Bandit on the Python
  # tooling. All three tools read their configuration from
  # pyproject.toml (ruff select = ALL with permanent, individually
  # justified ignores only; [tool.mypy] strict = true).
  python:
    # A reusable-workflow path plus a 40-character SHA cannot fit in 120
    # columns; the trailing version comment stays because that is the form
    # Dependabot reads and rewrites.
    # yamllint disable-line rule:line-length
    uses: stklug84/github-workflows/.github/workflows/python-validate.yml@176a7a46472032661cab6f62994177d107265cce  # v1.21.0
    with:
      paths: "scripts"
      config: "pyproject.toml"
      mypy-strict: "true"
      mypy-extra-deps: "rdflib>=7,<8"

  # The wheel + sdist must always build; the release workflow publishes
  # them from version tags (see release.yml).
  package-build:
    name: Package build (wheel + sdist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          set -euo pipefail
          pip install build
          python3 -m build

      # The default install must stay stdlib-only: mtgcards/mtgrules/
      # mtgviz import without rdflib, and mtgvalidate (which needs it)
      # must be absent until the validate extra is requested.
      - name: Import smoke test
        run: |
          set -euo pipefail
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import mtgcards, mtgviz"
          /tmp/smoke/bin/python - <<'PY'
          try:
              import rdflib
          except ImportError:
              pass
          else:
              raise SystemExit("rdflib must not be a default dependency")
          PY

      # mtgvalidate ships in the same wheel but is only importable with
      # the extra; this catches it being dropped from the hatch packages.
      - name: Validate-extra smoke test
        run: |
          set -euo pipefail
          python3 -m venv /tmp/smoke-validate
          /tmp/smoke-validate/bin/pip install "$(echo dist/*.whl)[validate]"
          /tmp/smoke-validate/bin/python -c "import mtgvalidate"
          /tmp/smoke-validate/bin/mtg-validate --help > /dev/null
