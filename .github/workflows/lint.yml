---
# title: Lint workflow
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-08-11
# keywords: [infrastructure, linting]
# comment: |
#   Lints the repository on pull requests against main:
#     - repo-lint    : actionlint (.github/workflows/*, incl. shellcheck
#                      on run: steps), yamllint (.yamllint.yml) and
#                      markdownlint (.markdownlint.yml) via the reusable
#                      stklug84/github-workflows repo-lint workflow
#     - python       : ruff (select = ALL) + mypy --strict + bandit on
#                      scripts/ via the reusable stklug84/github-workflows
#                      python-validate workflow (tool config in
#                      pyproject.toml)
#     - package-build: the magic-cards-tools wheel + sdist build and the
#                      wheel installs/imports (released via release.yml)
#     - rust-lint    : rustfmt, clippy (all + pedantic, warnings are
#                      errors) and cargo-deny (advisories, licences,
#                      duplicate versions, sources) on the Rust workspace
#                      under rust/ (lint config in rust/Cargo.toml,
#                      rust/clippy.toml and rust/deny.toml)
# ---
name: Lint

on:
  pull_request:
    branches:
      - main
      # stacked pull requests of the Rust port get CI before they are
      # retargeted to main
      - "rust-port/**"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a new push supersedes the in-flight lint of the same
# pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # markdownlint-cli2 has no ignore file - exclusions have to be negation
  # globs. .venv/node_modules/dist are inert on a clean checkout but keep
  # this identical to the command CONTRIBUTING.md documents. .opencode
  # holds agent and slash-command prompts, whose format is YAML
  # frontmatter followed by instruction prose - they are not documents
  # and do not carry a top-level heading (MD041).
  repo-lint:
    uses: stklug84/github-workflows/.github/workflows/repo-lint.yml@e099d4771b62e7814a0206424b176b91a1747ecc  # v4.1.0
    with:
      markdownlint-globs: |
        **/*.md
        !.venv
        !venv
        !node_modules
        !dist
        !.opencode

  # Ruff (lint + format check), mypy --strict and Bandit on the Python
  # tooling. All three tools read their configuration from
  # pyproject.toml (ruff select = ALL with permanent, individually
  # justified ignores only; [tool.mypy] strict = true).
  python:
    # A reusable-workflow path plus a 40-character SHA cannot fit in 120
    # columns; the trailing version comment stays because that is the form
    # Dependabot reads and rewrites.
    # yamllint disable-line rule:line-length
    uses: stklug84/github-workflows/.github/workflows/python-validate.yml@e099d4771b62e7814a0206424b176b91a1747ecc  # v4.1.0
    with:
      paths: "scripts"
      config: "pyproject.toml"
      mypy-strict: "true"
      mypy-extra-deps: "rdflib>=7,<8"

  # The wheel + sdist must always build; the release workflow publishes
  # them from version tags (see release.yml).
  package-build:
    name: Package build (wheel + sdist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          set -euo pipefail
          pip install build
          python3 -m build

      # The default install must stay stdlib-only: mtgcards/mtgrules/
      # mtgviz import without rdflib, and mtgvalidate (which needs it)
      # must be absent until the validate extra is requested.
      - name: Import smoke test
        run: |
          set -euo pipefail
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import mtgcards, mtgviz"
          /tmp/smoke/bin/python - <<'PY'
          try:
              import rdflib
          except ImportError:
              pass
          else:
              raise SystemExit("rdflib must not be a default dependency")
          PY

      # mtgvalidate ships in the same wheel but is only importable with
      # the extra; this catches it being dropped from the hatch packages.
      - name: Validate-extra smoke test
        run: |
          set -euo pipefail
          python3 -m venv /tmp/smoke-validate
          /tmp/smoke-validate/bin/pip install "$(echo dist/*.whl)[validate]"
          /tmp/smoke-validate/bin/python -c "import mtgvalidate"
          /tmp/smoke-validate/bin/mtg-validate --help > /dev/null

  # Rust counterpart of the python job. rustfmt and clippy read their
  # configuration from rust/rustfmt.toml, rust/Cargo.toml
  # ([workspace.lints]: clippy all + pedantic, unsafe forbidden) and
  # rust/clippy.toml; `-D warnings` makes every lint blocking, and a
  # suppression is only allowed per item (`#[expect(..., reason)]`).
  # cargo-deny is the bandit equivalent: known vulnerabilities, the licence
  # allow-list, duplicate dependency versions and crate sources
  # (rust/deny.toml). The compiler is pinned by rust/rust-toolchain.toml
  # and installed by the runner's rustup.
  #
  # The repository's actions policy only allows GitHub-owned, stklug84-owned
  # or explicitly listed actions, so caching uses actions/cache and
  # cargo-deny is a pinned release binary verified against its published
  # SHA-256 (the third-party rust-cache / cargo-deny-action are not used).
  rust-lint:
    name: Rust (fmt + clippy + deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install the pinned toolchain
        working-directory: rust
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show active-toolchain
          cargo clippy --version

      - name: Cache cargo registry and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: cargo-lint-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            cargo-lint-${{ runner.os }}-

      - name: rustfmt
        working-directory: rust
        run: cargo fmt --all --check

      - name: clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Pinned release of cargo-deny; the checksum is the one published
      # next to the asset (cargo-deny-<v>-x86_64-unknown-linux-musl.tar.gz.sha256).
      - name: Install cargo-deny
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        run: |
          set -euo pipefail
          asset="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${asset}.tar.gz"
          echo "${CARGO_DENY_SHA256}  cargo-deny.tar.gz" | sha256sum -c -
          tar xzf cargo-deny.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" "${asset}/cargo-deny"
          cargo deny --version

      - name: cargo-deny
        working-directory: rust
        run: cargo deny check
