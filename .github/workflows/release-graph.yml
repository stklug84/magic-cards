---
# title: Graph bundle release workflow
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-08-11
# keywords: [infrastructure, packaging, release, rdf]
# comment: |
#   Publishes the knowledge graph as a versioned data artifact on
#   graph-* tags, so an external consumer can pin a graph version
#   instead of checking this repository out. The bundle and the
#   magic-cards-tools wheel are
#   released on separate tag namespaces (graph-* vs v*) because the data
#   and the code move at different rates: an inventory update must not
#   force a code version bump.
#
#   The tag carries the content version: graph-YYYY-MM-DD. The bundle's
#   GRAPH-MANIFEST.json is the consumer contract - it declares the
#   graph_schema (the predicate vocabulary the simulator extracts, the
#   only enforced compatibility key), the ontology IRI, the CR edition
#   the simulation annotations were authored against, and the minimum
#   tools version. See scripts/build_graph_bundle.py and mtgcards.graph.
#
#   The artifact is validated before it is published: the bundle is
#   unpacked and must both serve the released simulator binaries as a
#   graph root (mtg-cr check, a short offline matchup) and pass the full
#   TTL + consistency check suite standalone. That build -> unpack ->
#   verify -> release sequence lives in the reusable stklug84/
#   github-workflows release-artifact workflow; only the commands
#   below are repository-specific. Each one runs with RELEASE_TAG,
#   RELEASE_VERSION (the tag without the graph- prefix) and BUNDLE_DIR
#   (the unpacked bundle) exported.
# ---
name: Release graph bundle

on:
  push:
    tags:
      - "graph-*"

permissions:
  contents: write

jobs:
  release:
    # A reusable-workflow path plus a 40-character SHA cannot fit in 120
    # columns; the trailing version comment stays because that is the form
    # Dependabot reads and rewrites.
    # yamllint disable-line rule:line-length
    uses: stklug84/github-workflows/.github/workflows/release-artifact.yml@e099d4771b62e7814a0206424b176b91a1747ecc  # v4.1.0
    permissions:
      contents: write
    with:
      tag-prefix: "graph-"
      version-pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'

      install-command: 'pip install ".[validate]"'

      # The CR text is gitignored and never redistributed. It is fetched
      # here only so the manifest can record which edition the simulation
      # annotations were authored against (consumers fetch it themselves
      # using that value), and so the simulator can validate its #[rule]
      # registry in the smoke test. The simulator itself is the released
      # binary of the tools version this checkout declares (pyproject's
      # version, which the manifest records as requires_tools): the smoke
      # test exercises exactly the pairing a consumer installs. The
      # archive is checked against the .sha256 published next to it.
      prepare-command: |
        CR_DATE=20260925
        curl -fsSL -o "MagicCompRules-${CR_DATE}.txt" \
          "https://media.wizards.com/2026/downloads/MagicCompRules%20${CR_DATE}.txt"
        tools="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
        name="mtg-simulate-v${tools}-x86_64-unknown-linux-gnu"
        base="https://github.com/stklug84/magic-cards/releases/download/v${tools}"
        mkdir -p /tmp/tools && cd /tmp/tools
        curl -fsSLO "${base}/${name}.tar.gz"
        curl -fsSLO "${base}/${name}.tar.gz.sha256"
        sha256sum -c "${name}.tar.gz.sha256"
        tar xzf "${name}.tar.gz"
        ln -s "/tmp/tools/${name}" /tmp/tools/bin
        /tmp/tools/bin/mtg-simulate --version

      build-command: 'python3 scripts/build_graph_bundle.py --graph-version "$RELEASE_VERSION"'

      unpack-glob: "dist/magic-cards-graph-*.tar.gz"

      stage-command: |
        cp MagicCompRules-*.txt "$BUNDLE_DIR"/
        cat "$BUNDLE_DIR/GRAPH-MANIFEST.json"

      # The bundle must be usable as a graph root on its own: this is
      # exactly what a consumer does after unpacking it. mtg-cr check
      # resolves the #[rule] registry against the CR text staged into
      # the bundle; the matchup loads the card index (the manifest's
      # graph_schema is enforced on the way) and plays over it.
      smoke-command: |
        export MTG_GRAPH_ROOT="$BUNDLE_DIR"
        test -f "$BUNDLE_DIR/GRAPH-MANIFEST.json"
        /tmp/tools/bin/mtg-cr check
        printf '// Commander\n1 Pia Nalaar, Chief Mechanic\n1 Sol Ring\n30 Swamp\n' > /tmp/a.txt
        printf '// Commander\n1 Pia Nalaar, Chief Mechanic\n1 Arcane Signet\n30 Mountain\n' > /tmp/b.txt
        /tmp/tools/bin/mtg-simulate /tmp/a.txt /tmp/b.txt --offline --games 1 --turn-cap 3

      # owl:imports resolution is the check that would catch a bundle
      # missing a graph its own files import.
      validate-command: 'mtg-validate --check ttl --check consistency "$BUNDLE_DIR"'

      release-assets: "dist/magic-cards-graph-*.tar.gz dist/GRAPH-MANIFEST.json"
      release-name: "Knowledge graph"
