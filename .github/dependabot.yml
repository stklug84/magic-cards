---
# title: Dependabot version updates configuration
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-07-25
# keywords: [infrastructure, dependencies]
# comment: |
#   Weekly version updates. For the github-actions ecosystem "/" covers
#   workflows in .github/workflows, including the version-pinned
#   stklug84/github-workflows reusable workflows; all action bumps are
#   grouped into a single pull request.
#
#   RDF note: Dependabot has no ecosystem for Turtle ontologies or
#   SPARQL queries, so the knowledge-graph content itself cannot be
#   tracked. The pip ecosystem below covers only the dev/CI tooling
#   declared in pyproject.toml (rdflib for the validators); the rules
#   engine and visualization packages are stdlib-only by design. The
#   cargo ecosystem covers the Rust simulator workspace under rust/
#   (rust/Cargo.lock is tracked because the workspace ships binaries);
#   its bumps are grouped into one pull request like the actions. The
#   pinned compiler in rust/rust-toolchain.toml is bumped by hand. The
#   docker ecosystem covers the manylinux_2_28 images the Linux release
#   binaries are built in (rust/release/*.Dockerfile, tag and digest):
#   monthly, because their glibc 2.28 is the point and never changes, and
#   one pull request for both architectures, so they stay on the same
#   image date. rust/release/build-linux.sh pins rustup-init by hand.
#   Documentation:
#   https://docs.github.com/code-security/dependabot/dependabot-version-updates
# ---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"  # Workflows in .github/workflows
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"  # Bundle all action bumps into a single PR

  - package-ecosystem: "pip"
    directory: "/"  # pyproject.toml — dev/CI tooling dependencies only
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/rust"  # the Rust workspace (Cargo.toml + Cargo.lock)
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns:
          - "*"  # Bundle all crate bumps into a single PR

  - package-ecosystem: "docker"
    directory: "/rust/release"  # the Linux release build images
    schedule:
      interval: "monthly"
    groups:
      release-images:
        patterns:
          - "*"  # Both architectures' images in one PR
