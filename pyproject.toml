[project]
name = "magic-cards-tools"
version = "0.0.0"
description = "Validation and simulation tooling for the MTG knowledge graph (dev/CI only)."
requires-python = ">=3.12"
dependencies = [
    "rdflib>=7,<8",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["scripts"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # --- PERMANENT: formatter conflicts (ruff format owns these) ----------
    "COM812", # PERMANENT: missing-trailing-comma conflicts with the formatter
    "ISC001", # PERMANENT: implicit string concat conflicts with the formatter
    # --- PERMANENT: mutually exclusive docstring conventions ---------------
    "D203", # PERMANENT: incompatible with D211 (house style: no blank line before class docstring)
    "D213", # PERMANENT: incompatible with D212 (house style: summary on the first line)
    # --- PERMANENT: genuinely wrong for this repository ---------------------
    "S311",  # PERMANENT: random module drives game simulation, not cryptography
    "PT009", # PERMANENT: test suites deliberately use stdlib unittest, not pytest
    "PT027", # PERMANENT: unittest assertRaises is the house test idiom
    # --- PERMANENT: house style has no per-file copyright notices ---------
    "CPY001", # PERMANENT: single-author personal repo; provenance is git history
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["scripts"]
strict = true
warn_unreachable = false

# rich is an OPTIONAL dependency of mtgviz/tui.py (guarded by
# try/except ImportError with a HAVE_RICH fallback). GitHub runners
# happen to preinstall it; this override keeps mypy deterministic on
# machines without it.
[[tool.mypy.overrides]]
module = "rich.*"
ignore_missing_imports = true

[tool.bandit]
# B311: the random module drives game simulation and deck shuffling, not
# cryptography. Mirrors the permanent ruff S311 ignore.
skips = ["B311"]

