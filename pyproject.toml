[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magic-cards-tools"
version = "0.2.0"
description = "Simulation tooling for the MTG knowledge graph: CR-grounded Commander matchup simulator, card data layer, game visualization, and graph validators."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# the packaged simulator is stdlib-only; the knowledge graph itself is
# not bundled - point MTG_GRAPH_ROOT at a magic-cards checkout or at an
# unpacked graph bundle (see scripts/build_graph_bundle.py)
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
    # distributed via GitHub Releases only; rejected by PyPI on purpose
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
tui = ["rich"]
# the mtgvalidate package: graph/query validators for downstream repos
# that check their own TTL files against a published graph bundle. Kept
# out of the default install so mtgcards/mtgrules/mtgviz stay stdlib-only.
validate = ["rdflib>=7,<8"]
# rdflib also powers the repo-only generator scripts (not packaged)
dev = ["rdflib>=7,<8"]

[project.urls]
Homepage = "https://github.com/stklug84/magic-cards"
Source = "https://github.com/stklug84/magic-cards"
Issues = "https://github.com/stklug84/magic-cards/issues"
Releases = "https://github.com/stklug84/magic-cards/releases"

[project.scripts]
mtg-simulate = "mtgrules.cli:main"
mtg-selfplay = "mtgrules.selfplay:main"
# requires the [validate] extra (rdflib)
mtg-validate = "mtgvalidate.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "scripts/mtgcards",
    "scripts/mtgrules",
    "scripts/mtgvalidate",
    "scripts/mtgviz",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "scripts/mtgcards",
    "scripts/mtgrules",
    "scripts/mtgvalidate",
    "scripts/mtgviz",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["scripts"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # --- PERMANENT: formatter conflicts (ruff format owns these) ----------
    "COM812", # PERMANENT: missing-trailing-comma conflicts with the formatter
    "ISC001", # PERMANENT: implicit string concat conflicts with the formatter
    # --- PERMANENT: mutually exclusive docstring conventions ---------------
    "D203", # PERMANENT: incompatible with D211 (house style: no blank line before class docstring)
    "D213", # PERMANENT: incompatible with D212 (house style: summary on the first line)
    # --- PERMANENT: genuinely wrong for this repository ---------------------
    "S311",  # PERMANENT: random module drives game simulation, not cryptography
    "PT009", # PERMANENT: test suites deliberately use stdlib unittest, not pytest
    "PT027", # PERMANENT: unittest assertRaises is the house test idiom
    # --- PERMANENT: house style has no per-file copyright notices ---------
    "CPY001", # PERMANENT: single-author personal repo; provenance is git history
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["scripts"]
strict = true
warn_unreachable = false

# rich is an OPTIONAL dependency of mtgviz/tui.py (guarded by
# try/except ImportError with a HAVE_RICH fallback). GitHub runners
# happen to preinstall it; this override keeps mypy deterministic on
# machines without it.
[[tool.mypy.overrides]]
module = "rich.*"
ignore_missing_imports = true

[tool.bandit]
# B311: the random module drives game simulation and deck shuffling, not
# cryptography. Mirrors the permanent ruff S311 ignore.
skips = ["B311"]

