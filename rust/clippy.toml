# Proper nouns that clippy::doc_markdown would otherwise insist on seeing
# in backticks. ".." keeps clippy's built-in list.
doc-valid-idents = [
    "..",
    "CPython",
    "GitHub",
    "JSONL",
    "MagicCompRules",
    "MTG_GRAPH_ROOT",
    "SHA-256",
    "MTG",
    "Moxfield",
    "OpenSSL",
    "Scryfall",
    "WUBRG",
    "WUBRGC",
]
