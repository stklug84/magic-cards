[package]
name = "pycompat"
description = "CPython-compatible randomness, json.dumps, number formatting, statistics and repr, for byte-exact output parity with the former Python simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# exact rational arithmetic for statistics.stdev (CPython uses Fractions)
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[dev-dependencies]
# reading the CPython reference vectors under tests/vectors
serde = { version = "1", features = ["derive"] }
# preserve_order: the vectors' dict order is the point; float_roundtrip:
# serde_json's fast float parser may be off by one ulp otherwise
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[lints]
workspace = true
